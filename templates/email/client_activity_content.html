<p style="margin:0 0 20px;font-size:18px;line-height:1.4;font-weight:700;color:#1A1A1A;">{{ intro }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;border-collapse:collapse;">
  {% for row in rows %}<tr>
    <td style="padding:10px 0;border-bottom:1px solid #EEEEEE;font-size:16px;line-height:1.5;color:{{ text_color }};">
      <strong style="color:#1A1A1A;">{{ row.who }}</strong> {{ row.what }}
      <div style="font-size:14px;line-height:1.4;color:{{ faint }};">{{ row.when }}</div>
    </td>
  </tr>
  {% endfor %}
</table>
<p style="margin:0;font-size:16px;">{{ closing }}</p>
