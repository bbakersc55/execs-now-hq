<!DOCTYPE html>
<html lang="en" data-enhq-email="personal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#FFFFFF;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FFFFFF;border-collapse:collapse;">
  <tr>
    <td align="left" style="padding:8px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:680px;border-collapse:collapse;">
        <tr>
          <td style="padding:16px 8px;font-family:{{ font }};font-size:16px;line-height:1.6;color:{{ text_color }};">{{ content|safe }}{% if footer_html %}<div data-enhq-footer style="margin:20px 0 0;font-size:13px;line-height:1.5;color:{{ faint }};">{{ footer_html|safe }}</div>{% endif %}<!--enhq-unsubscribe--></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
