<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Connect an AI app{% endblock %} · {{ product }}</title>
<link rel="icon" href="/static/brand/favicon.ico">
<style>
  :root { --navy: #0d2c54; --orange: #e87722; --orange-hover: #eb8b43; --ink: #1f2933;
          --muted: #5b6573; --line: #dfe3e8; --bg: #f5f6f8; --card: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--navy); color: #fff; padding: 14px 16px; }
  header .in { max-width: 560px; margin: 0 auto; font-weight: 700; letter-spacing: .01em; }
  main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 24px; }
  h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 6px; color: var(--navy); }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 18px;
       padding: 14px 16px; background: #f0f3f7; border-radius: 8px; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; }
  h2 { font-size: 1rem; margin: 18px 0 6px; color: var(--navy); }
  ul { margin: 0 0 12px; padding-left: 20px; } li { margin: 2px 0; }
  .provider { border-left: 4px solid var(--orange); background: #fdf3ea; padding: 12px 14px;
              border-radius: 0 8px 8px 0; margin: 18px 0; color: #4a2c0c; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  button, a.button { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px;
                     border: 1px solid var(--line); background: #fff; color: var(--ink);
                     cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, a.button.primary { background: var(--orange); border-color: var(--orange);
                                     color: var(--navy); }
  button.primary:hover, a.button.primary:hover { background: var(--orange-hover); }
  .note { color: var(--muted); font-size: .9rem; margin-top: 16px; }
  @media (max-width: 420px) { .card { padding: 18px; } dl { grid-template-columns: 1fr; gap: 0 0; }
    dd { margin-bottom: 6px; } .actions button, .actions a.button { flex: 1 1 100%; } }
</style>
</head>
<body>
<header><div class="in">{{ product }}</div></header>
<main><div class="card">{% block body %}{% endblock %}</div></main>
</body>
</html>
